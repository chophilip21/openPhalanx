# Releases on every merged PR into main whose title has a release prefix:
#   [bug]/[fix] -> patch, [feature]/[feat] -> minor, [major]/[breaking] -> major
# (scripts/bump_version.py). Other prefixes ([docs], [ci], ...) don't release.
#
# 1. version: bump Cargo.toml, Cargo.lock and the app's package files together,
#    add a CHANGELOG.md entry, commit "Release vX.Y.Z" to main, tag vX.Y.Z.
# 2. Start publish.yml on main for the new tag: builds, the GitHub release,
#    docs on GitHub Pages and (with a self-hosted runner) the backend image.
#
# Repository settings needed: Actions may write to contents (and push to main,
# if main is protected), and Pages uses "GitHub Actions" as its source.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [bug, feature, major]
      summary:
        description: Changelog line
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump the version from the PR title
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUMP: ${{ inputs.bump }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          if [ -n "$BUMP" ]; then TITLE="[$BUMP] $SUMMARY"; else TITLE="$PR_TITLE"; fi
          version="$(python3 scripts/bump_version.py --title "$TITLE" ${PR_NUMBER:+--pr "$PR_NUMBER"})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "No release for: $TITLE"; fi
      - name: Commit and tag
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # CHANGELOG.md is new on the first release
          git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          # Bring dev along when it hasn't moved since the merge.
          git push origin HEAD:dev || echo "::warning::dev has new commits; merge main into dev to pick up v$VERSION"
      - name: Build and publish the release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        # A tag pushed with GITHUB_TOKEN starts no workflow, but a dispatch does.
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="v$VERSION"
