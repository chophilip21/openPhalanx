# Every pull request and every push to dev/main: build, lint and test.
# The GPU lifecycle test (cargo run -p openphalanx-core --example lifecycle)
# needs an NVIDIA GPU and stays a manual step on the server node.
name: CI

on:
  pull_request:
    # edited: a corrected PR title must re-run the title check (a re-run of the
    # old run keeps the old title).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # PRs into main release a version; the title prefix decides which bump.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the PR title prefix ([bug], [feature], [major], or a no-release prefix)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/bump_version.py --check --title "$TITLE"
      - name: Prefixes are read in any case
        run: |
          python3 - <<'PY'
          import importlib.util as u
          s = u.spec_from_file_location("b", "scripts/bump_version.py"); b = u.module_from_spec(s); s.loader.exec_module(b)
          for title, want in (("[Bug] x", "patch"), ("[FEATURE] x", "minor"), ("[ Feature ] x", "minor"), ("[Major] x", "major"), ("[Docs] x", None), ("[bug]x", "patch")):
              assert b.parse_title(title)[0] == want, title
          PY

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for the Tauri app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App frontend (build + type check)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p openphalanx-core -p oppx --locked

  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (syntax errors and undefined names)
        run: |
          pip install ruff
          ruff check --select F,E9 --target-version py312 docker/server client/oppx/frontend scripts
      - name: Connector tests (MCP client and the agent's tool calls; no server needed)
        run: |
          pip install httpx
          python3 scripts/test_connectors.py
      - name: Agent loop tests (scripted model; no server needed)
        run: |
          # Documents and pictures: the engine's extras (engine.rs EXTRAS) and Pillow (comes with Aider).
          pip install pillow pypdf==6.19.0 fpdf2==2.8.9 resvg_py==0.5.0
          python3 scripts/test_agent.py
      - name: Request trace tests (the gateway's trace module; no dependencies)
        run: python3 scripts/test_reqtrace.py
      - name: Input checks (what the loaded model takes; the gateway's inputs module; no dependencies)
        run: python3 scripts/test_inputs.py
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Regular expressions (every pattern compiled and checked for catastrophic backtracking)
        run: |
          npm ci --prefix scripts/regexcheck
          python3 scripts/test_check_regexes.py
          python3 scripts/check_regexes.py
      - name: Search guard tests (the gateway's pacing and pause for web search; no dependencies)
        run: python3 scripts/test_searchguard.py
      - name: Command allowlist tests (what the agent may run without asking; no dependencies)
        run: python3 scripts/test_permissions.py
      - name: Shell syntax
        # Each script with its own interpreter (bash scripts use arrays).
        run: |
          for f in scripts/*.sh docker/server/*.sh; do
            case "$(head -1 "$f")" in *bash*) bash -n "$f" ;; *) sh -n "$f" ;; esac
          done
      - name: Version bump rules
        run: |
          python3 scripts/bump_version.py --check --title "[bug] x"
          python3 scripts/bump_version.py --check --title "[FEATURE] x"
          python3 scripts/bump_version.py --check --title "[docs] x"
          ! python3 scripts/bump_version.py --check --title "no prefix"
