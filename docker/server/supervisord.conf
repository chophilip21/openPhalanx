; Included by /etc/supervisor/supervisord.conf. All process output goes to the
; container's stdout/stderr so `docker logs -f` shows SGLang cache stats.

[program:sglang]
command=/opt/openphalanx/start-sglang.sh
priority=10
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=/opt/aider/bin/python /opt/openphalanx/agent_server.py
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
environment=PATH="/opt/aider/bin:%(ENV_PATH)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
