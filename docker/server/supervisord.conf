; Included by /etc/supervisor/supervisord.conf. All process output goes to the
; container's stdout/stderr so `docker logs -f` shows SGLang cache stats.

[program:sglang]
command=/opt/openphalanx/start-sglang.sh
priority=10
; start-sglang.sh stops the container if SGLang dies; never crash-loop.
autorestart=false
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=/opt/gateway/bin/python /opt/openphalanx/gateway.py
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
