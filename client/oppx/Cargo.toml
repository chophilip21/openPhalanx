[package]
name = "oppx"
description = "Openphalanx client: pairs a laptop with a GPU server and runs a local coding agent against it"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oppx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
