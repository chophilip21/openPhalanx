<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openphalanx</title>
    <!-- The launch screen is plain markup and inline CSS, so it is drawn with
         the page's first frame, before the app's code has loaded (in the
         theme's colors: the window used to flash white, then stay blank).
         App.svelte removes it once the app is connected, two seconds at the
         earliest. -->
    <style>
      html { background: #0a0e16; }
      @media (prefers-color-scheme: light) { html { background: #f4f6fa; } }
      html[data-theme="dark"] { background: #0a0e16; }
      html[data-theme="light"] { background: #f4f6fa; }

      #splash {
        --s-bg: #0a0e16; --s-on: #34d399; --s-glow: rgba(52, 211, 153, 0.35); --s-text: #e8edf6; --s-track: #1e2840;
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: var(--s-bg); color: var(--s-on);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.35s ease;
      }
      html[data-theme="light"] #splash {
        --s-bg: #f4f6fa; --s-on: #059669; --s-glow: rgba(5, 150, 105, 0.28); --s-text: #121826; --s-track: #e2e7f0;
      }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash svg { width: 96px; height: 100px; display: block; overflow: visible; filter: drop-shadow(0 0 18px var(--s-glow)); }
      #splash .draw path { stroke-dasharray: 1; stroke-dashoffset: 1; }
      #splash .spokes, #splash .hub, #splash .bar { opacity: 0; }
      #splash .word {
        font-weight: 600; font-size: 17px; letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase;
        color: var(--s-text); opacity: 0; transform: translateY(4px);
      }
      #splash .bar { width: 120px; height: 2px; border-radius: 2px; background: var(--s-track); overflow: hidden; }
      #splash .bar span { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--s-on); transform: translateX(-100%); }

      /* Started by splash.js on the first frame. */
      #splash.go .draw path { animation: splash-draw 0.9s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
      #splash.go .arrow path { animation-delay: 0.7s; animation-duration: 0.5s; }
      #splash.go .spokes { animation: splash-fade 0.6s ease 0.5s forwards; }
      #splash.go .hub { animation: splash-fade 0.4s ease 0.9s forwards; }
      #splash.go .word { animation: splash-rise 0.7s ease 0.6s forwards; }
      #splash.go .bar { animation: splash-fade 0.4s ease 1s forwards; }
      #splash.go .bar span { animation: splash-slide 1.1s ease-in-out infinite; }

      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-rise { to { opacity: 1; transform: none; } }
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

      @media (prefers-reduced-motion: reduce) {
        #splash .draw path { stroke-dashoffset: 0; animation: none !important; }
        #splash .spokes, #splash .hub, #splash .word, #splash .bar { opacity: 1; transform: none; animation: none !important; }
        #splash .bar span { width: 100%; transform: none; animation: none !important; }
      }
    </style>
    <script src="/splash.js"></script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Starting Openphalanx">
      <svg viewBox="0 0 420 440" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="draw">
          <path pathLength="1" d="M31 96 L164 45 L297 96 L297 184" />
          <path pathLength="1" d="M297 236 C296 306 253 359 164 399 C75 359 31 306 31 227 L31 96" />
        </g>
        <g class="spokes" stroke-width="10">
          <path d="M38 103 L164 213 L164 53" />
          <path d="M290 103 L164 213" />
          <path d="M164 391 L164 213" />
          <path d="M62 319 L164 213 L267 319" />
          <path d="M31 213 L126 213" />
        </g>
        <g class="draw arrow">
          <path pathLength="1" d="M202 213 H376" />
          <path pathLength="1" d="M337 173 L377 213 L337 253" />
        </g>
        <circle class="hub" cx="164" cy="213" r="32" fill="var(--s-bg)" />
      </svg>
      <div class="word">Openphalanx</div>
      <div class="bar" aria-hidden="true"><span></span></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
