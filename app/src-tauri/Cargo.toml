[package]
name = "openphalanx"
description = "Openphalanx server GUI: runs the SGLang + Aider backend and pairs clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openphalanx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
openphalanx-core = { path = "../../crates/openphalanx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "signal", "sync", "time"] }
